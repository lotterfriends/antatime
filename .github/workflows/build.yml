name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  # Standard-Sync-Server in der App (Repository-Variable, z. B. antatime.de)
  SYNC_URL: ${{ vars.SYNC_URL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: ./scripts/test.sh

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        run: ./scripts/build_android.sh
        env:
          # Optional: Repository-Secrets für eine echte Release-Signatur.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Web
        run: ./scripts/build_web.sh
        env:
          # Für GitHub Pages wird die App unter /<repo>/ ausgeliefert.
          BASE_HREF: ${{ vars.DEPLOY_PAGES == 'true' && format('/{0}/', github.event.repository.name) || '/' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.zip
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
        with:
          path: build/web

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linux-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Linux (tar.gz, deb, AppImage)
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  windows:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Inno Setup bereitstellen
        run: command -v iscc || [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
      - name: Build Windows (Installer, Zip)
        run: ./scripts/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  # Wie iOS optional, da macOS-Runner knapp sein können.
  macos:
    needs: test
    if: vars.SKIP_MACOS != 'true'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build macOS (dmg, unsigniert)
        run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: ignore

  # iOS ist optional: macOS-Runner sind bei GitHub oft knapp („job was not
  # acquired“). Ein Fehlschlag hier macht den Lauf nicht rot und blockiert
  # kein Release. Komplett abschalten: Repository-Variable SKIP_IOS=true.
  ios:
    needs: test
    if: vars.SKIP_IOS != 'true'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build iOS (unsigniert)
        run: ./scripts/build_ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: ignore

  # Optional: Web-App auf GitHub Pages veröffentlichen.
  # Aktivieren: Settings → Pages → Source „GitHub Actions“ und
  # Repository-Variable DEPLOY_PAGES=true setzen.
  pages:
    needs: web
    if: vars.DEPLOY_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bei Tags (v1.2.3) ein GitHub-Release mit allen Paketen erstellen.
  release:
    needs: [android, web, linux, windows, ios, macos]
    # Läuft auch, wenn iOS/macOS fehlschlagen oder übersprungen werden.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.android.result == 'success' && needs.web.result == 'success' &&
      needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
